<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SanjinChat 聊天室</title>
<style>
/* ===== MD3 基础设计令牌 ===== */
:root {
  --md-primary: #6750A4; --md-on-primary: #FFFFFF;
  --md-primary-container: #EADDFF; --md-on-primary-container: #21005D;
  --md-secondary: #625B71; --md-secondary-container: #E8DEF8;
  --md-tertiary: #7D5260; --md-tertiary-container: #FFD8E4;
  --md-error: #B3261E; --md-error-container: #F9DEDC;
  --md-surface: #FFFBFE; --md-surface-container: #F3EDF7;
  --md-surface-container-low: #F7F2FA; --md-surface-container-high: #ECE6F0;
  --md-surface-container-highest: #E6E0E9;
  --md-on-surface: #1D1B20; --md-on-surface-variant: #49454F;
  --md-outline: #79747E; --md-outline-variant: #CAC4D0;
  --md-shadow-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
  --md-shadow-2: 0 3px 6px rgba(0,0,0,0.12), 0 2px 4px rgba(0,0,0,0.08);
  --md-shadow-3: 0 10px 20px rgba(0,0,0,0.12), 0 3px 6px rgba(0,0,0,0.08);
  --md-radius-sm: 8px; --md-radius-md: 12px; --md-radius-lg: 16px;
  --md-radius-xl: 28px; --md-radius-full: 9999px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--md-on-surface); background: var(--md-surface); font-size: 15px; line-height: 1.5; }
button, input, textarea, select { font-family: inherit; font-size: inherit; }
a { color: var(--md-primary); text-decoration: none; }
.hidden { display: none !important; }
#app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 640px; margin: 0 auto; position: relative; overflow: hidden; background: var(--md-surface); }
.page { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
.topbar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; padding: 12px 16px; background: var(--md-surface-container); min-height: 56px; border-bottom: 1px solid var(--md-outline-variant); }
.topbar h1 { font-size: 22px; font-weight: 500; margin: 0 12px; flex: 1; }

.icon-btn:hover { background: var(--md-surface-container-high); }
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 640px; display: flex; background: var(--md-surface-container); padding: 4px 8px calc(4px + var(--safe-bottom)); box-shadow: 0 -2px 8px rgba(0,0,0,0.06); z-index: 100; border-top: 1px solid var(--md-outline-variant); }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 4px; gap: 4px; cursor: pointer; border-radius: var(--md-radius-md); color: var(--md-on-surface-variant); border: none; background: transparent; position: relative; }
.nav-item.active { color: var(--md-on-secondary-container); }
.nav-item.active::before { content: ''; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 56px; height: 28px; background: var(--md-secondary-container); border-radius: var(--md-radius-full); z-index: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 24px; height: 40px; border-radius: var(--md-radius-full); border: none; cursor: pointer; font-weight: 500; }
.btn-filled { background: var(--md-primary); color: var(--md-on-primary); box-shadow: var(--md-shadow-1); }
.btn-tonal { background: var(--md-secondary-container); color: var(--md-on-primary-container); }
.btn-outline { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline); padding: 0 23px; }

.btn-text:hover { background: var(--md-surface-container-high); }
.btn-danger { background: var(--md-error); color: #fff; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.field { position: relative; margin-bottom: 16px; }
.field input, .field textarea { width: 100%; padding: 16px 14px 14px; border: 1px solid var(--md-outline); border-radius: var(--md-radius-sm); background: transparent; outline: none; font-size: 16px; color: var(--md-on-surface); min-height: 56px; }
.field textarea { resize: vertical; min-height: 100px; }
.field input:focus, .field textarea:focus { border-width: 2px; border-color: var(--md-primary); padding: 15px 13px 13px; }
.field label { position: absolute; left: 12px; top: 16px; color: var(--md-on-surface-variant); font-size: 16px; pointer-events: none; transition: all 0.15s ease; background: var(--md-surface); padding: 0 4px; }
.field input:focus + label, .field input:not(:placeholder-shown) + label,
.field textarea:focus + label, .field textarea:not(:placeholder-shown) + label {
  top: -8px; font-size: 12px; color: var(--md-primary);
}

.card-list-item .time { font-size: 11px; color: var(--md-on-surface-variant); white-space: nowrap; }

.avatar { width: 44px; height: 44px; border-radius: var(--md-radius-full); display: inline-flex; align-items: center; justify-content: center; overflow: hidden; background: var(--md-primary-container); color: var(--md-on-primary-container); font-size: 22px; flex-shrink: 0; position: relative; }

.login-wrap { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 24px; background: linear-gradient(180deg, var(--md-primary-container) 0%, var(--md-surface) 40%); }

.login-logo { text-align: center; margin-bottom: 24px; }

.login-tabs button.active { background: var(--md-primary); color: var(--md-on-primary); }
.switch-auth { text-align: center; margin-top: 16px; color: var(--md-on-surface-variant); font-size: 14px; }
.switch-auth a { cursor: pointer; color: var(--md-primary); font-weight: 500; }

.announcement-banner { background: linear-gradient(90deg, var(--md-tertiary-container), var(--md-primary-container)); margin: 12px 16px 0; padding: 12px 16px; border-radius: var(--md-radius-md); box-shadow: var(--md-shadow-1); cursor: pointer; }
.announcement-banner .label { font-size: 12px; color: var(--md-on-primary-container); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.announcement-banner .content { font-size: 14px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.search-bar { display: flex; align-items: center; margin: 12px 16px; padding: 0 16px; gap: 8px; background: var(--md-surface-container-high); border-radius: var(--md-radius-full); height: 48px; }

.chat-header { display: flex; align-items: center; padding: 12px 8px; background: var(--md-surface-container); min-height: 60px; gap: 4px; border-bottom: 1px solid var(--md-outline-variant); }
.chat-header .title { font-size: 17px; font-weight: 500; }

.chat-msgs { flex: 1; overflow-y: auto; padding: 16px 12px; background: var(--md-surface-container-lowest); display: flex; flex-direction: column; gap: 8px; }

.chat-input-bar { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px calc(8px + var(--safe-bottom)); background: var(--md-surface-container); border-top: 1px solid var(--md-outline-variant); position: relative; }
.chat-input-bar .icon-btn { flex-shrink: 0; }

.send-btn.recording { background: var(--md-error); animation: pulse 1s infinite; }
.recording-hint { position: absolute; top: -50px; left: 50%; transform: translateX(-50%); background: var(--md-error); color: #fff; padding: 8px 16px; border-radius: var(--md-radius-full); font-size: 14px; display: none; }
.recording-hint.show { display: block; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.contacts-section { margin: 16px 16px 0; }
.contacts-section h3 { margin: 0 0 8px; font-size: 14px; color: var(--md-on-surface-variant); font-weight: 500; padding: 0 4px; }
.contacts-section .card { margin: 0; padding: 0; }
.badge-pending { background: var(--md-primary); color: var(--md-on-primary); font-size: 11px; padding: 2px 8px; border-radius: var(--md-radius-full); }
.badge-rejected { background: var(--md-error-container); color: var(--md-error); font-size: 11px; padding: 2px 8px; border-radius: var(--md-radius-full); }
.badge-accepted { background: #C8E6C9; color: #2E7D32; font-size: 11px; padding: 2px 8px; border-radius: var(--md-radius-full); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--md-surface); border-radius: var(--md-radius-xl); width: 100%; max-width: 360px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.25s cubic-bezier(0.2,0,0,1); box-shadow: var(--md-shadow-3); }

.modal-body { padding: 16px 20px 24px; }

<body>
<div id="app"></div>
<div id="toast-container"></div>
<script>
/* =====================================================================
   SanjinChat 前端应用 (MD3 风格单页应用)
   ===================================================================== */
(function () {
  'use strict';
  const state = {
    server: localStorage.getItem('sanjin_server') || 'your-server.com:8181',
    token: localStorage.getItem('sanjin_token') || '',
    me: null,
    ws: null, wsReconnectTimer: null,
    currentPage: 'login', currentTab: 'chat',
    currentChat: null,

    bar.appendChild(hint);
    const imgBtn = $el('button', { class: 'icon-btn', title: '发送图片' }, '🖼️'); bar.appendChild(imgBtn);
    const imgInput = $el('input', { type: 'file', accept: 'image/*', class: 'hidden' }); bar.appendChild(imgInput);
    imgBtn.onclick = () => imgInput.click();
    imgInput.onchange = () => { const f = imgInput.files[0]; if (f) sendImageFile(f); imgInput.value = ''; };
    const inputWrap = $el('div', { class: 'input-wrap' });
    const tArea = $el('textarea', { placeholder: '输入消息...', rows: 1 });
    inputWrap.appendChild(tArea);
    bar.appendChild(inputWrap);
    const sendBtn = $el('button', { class: 'send-btn', title: '发送' }, '✈️');
    bar.appendChild(sendBtn);

    // 自适应 textarea 高度
    tArea.addEventListener('input', () => {
      tArea.style.height = 'auto';
      tArea.style.height = Math.min(tArea.scrollHeight, 120) + 'px';
      sendBtn.innerHTML = tArea.value.trim() ? '✈️' : '🎤';
    });
    tArea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
    });
    sendBtn.onclick = () => { if (tArea.value.trim()) sendText(); };

    // 长按录音 (在 sendBtn 上)
    let pressTimer = null, isPressing = false, cancelled = false, startX = 0, startY = 0;
    function doPressStart(e) {
      // 只有文字为空时才录音
      if (tArea.value.trim()) { sendText(); return; }
      e.preventDefault();
      const touch = e.touches ? e.touches[0] : e;
      startX = touch.clientX; startY = touch.clientY;
      cancelled = false; isPressing = false;
      pressTimer = setTimeout(() => startRecording(), 250);
      window.addEventListener('mouseup', doPressEnd, { once: true });
      window.addEventListener('touchend', doPressEnd, { once: true });
      window.addEventListener('mousemove', doPressMove);
      window.addEventListener('touchmove', doPressMove);
    }
    function doPressMove(e) {
      if (!isPressing) return;
      const touch = e.touches ? e.touches[0] : e;
      if (!touch) return;
      // 向上或向左滑动超过 80px -> 取消
      const dy = startY - touch.clientY;
      const dx = startX - touch.clientX;
      if (dy > 60 || Math.abs(dx) > 60) {
        cancelled = true;
        hint.textContent = '松开取消发送';
      } else {
        cancelled = false;
        hint.textContent = '🎙️ 正在录音... 松开发送，滑动取消';
      }
    }
    function doPressEnd() {
      window.removeEventListener('mousemove', doPressMove);
      window.removeEventListener('touchmove', doPressMove);
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (!isPressing) return;
      stopRecording(cancelled);
    }
    sendBtn.addEventListener('mousedown', doPressStart);
    sendBtn.addEventListener('touchstart', doPressStart, { passive: false });

    page.appendChild(bar);
    document.body.appendChild(page);

    function sendText() {
      const text = tArea.value;
      if (!text.trim()) return;
      if (state.currentChat.type === 'private') {
        wsSend({ type: 'private_message', toId: state.currentChat.id, contentType: 'text', content: text });
      } else {
        wsSend({ type: 'group_message', groupId: state.currentChat.id, contentType: 'text', content: text });
      }
      // 本地先追加
      const msg = {
        id: 'local_' + Date.now(), type: state.currentChat.type === 'private' ? 'private_message' : 'group_message',
        fromId: state.me.id, fromNickname: state.me.nickname,
        toId: state.currentChat.type === 'private' ? state.currentChat.id : null,
        groupId: state.currentChat.type === 'group' ? state.currentChat.id : null,
        contentType: 'text', content: text, timestamp: Date.now(), _pending: true
      };
      const k2 = chatKey(state.currentChat.type, state.currentChat.id);
      if (!state.chatMessages[k2]) state.chatMessages[k2] = [];
      state.chatMessages[k2].push(msg);
      appendMsgEl(msg); scrollChatBottom(); saveMsgCache();
      tArea.value = ''; tArea.style.height = 'auto'; sendBtn.innerHTML = '🎤';
    }

    async function sendImageFile(f) {
      if (f.size > 10 * 1024 * 1024) return toast('图片大于 10MB', 'error');
      try {
        const fd = new FormData(); fd.append('image', f);
        toast('上传图片中...');
        const r = await http('/upload/image', { method: 'POST', body: fd });
        if (state.currentChat.type === 'private') wsSend({ type: 'private_message', toId: state.currentChat.id, contentType: 'image', image: r.url });
        else wsSend({ type: 'group_message', groupId: state.currentChat.id, contentType: 'image', image: r.url });
        const msg = {
          id: 'local_' + Date.now(), type: state.currentChat.type === 'private' ? 'private_message' : 'group_message',
          fromId: state.me.id, fromNickname: state.me.nickname,
          toId: state.currentChat.type === 'private' ? state.currentChat.id : null,
          groupId: state.currentChat.type === 'group' ? state.currentChat.id : null,
          contentType: 'image', image: r.url, timestamp: Date.now()
        };
        const k2 = chatKey(state.currentChat.type, state.currentChat.id);
        if (!state.chatMessages[k2]) state.chatMessages[k2] = [];
        state.chatMessages[k2].push(msg);
        appendMsgEl(msg); scrollChatBottom(); saveMsgCache();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function startRecording() {
      isPressing = true; sendBtn.classList.add('recording'); hint.classList.add('show');
      hint.textContent = '🎙️ 正在录音... 松开发送，滑动取消';
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('浏览器不支持录音');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.audioChunks = [];
        state.audioStartTs = Date.now();
        const Cls = window.MediaRecorder;
        const mr = new Cls(stream, { mimeType: Cls.isTypeSupported('audio/webm') ? 'audio/webm' : (Cls.isTypeSupported('audio/mp4') ? 'audio/mp4' : undefined) });
        state.mediaRecorder = mr;
        mr.ondataavailable = e => { if (e.data && e.data.size) state.audioChunks.push(e.data); };
        mr.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          sendBtn.classList.remove('recording'); hint.classList.remove('show');
          const duration = Math.round((Date.now() - state.audioStartTs) / 1000);
          if (cancelled || duration < 1) {
            if (duration < 1 && !cancelled) toast('录音时间太短', 'error');
            state.audioChunks = []; return;
          }
          try {
            const blob = new Blob(state.audioChunks, { type: mr.mimeType || 'audio/webm' });
            const fd = new FormData(); fd.append('audio', blob, 'recording.' + (mr.mimeType && mr.mimeType.includes('mp4') ? 'm4a' : 'webm'));
            fd.append('duration', String(duration));
            toast('上传语音中...');
            const r = await http('/upload/audio', { method: 'POST', body: fd });
            if (state.currentChat.type === 'private') wsSend({ type: 'private_message', toId: state.currentChat.id, contentType: 'audio', audio: { url: r.url, duration: r.duration || duration } });
            else wsSend({ type: 'group_message', groupId: state.currentChat.id, contentType: 'audio', audio: { url: r.url, duration: r.duration || duration } });
            const msg = {
              id: 'local_' + Date.now(), type: state.currentChat.type === 'private' ? 'private_message' : 'group_message',
              fromId: state.me.id, fromNickname: state.me.nickname,
              toId: state.currentChat.type === 'private' ? state.currentChat.id : null,
              groupId: state.currentChat.type === 'group' ? state.currentChat.id : null,
              contentType: 'audio', audio: { url: r.url, duration: r.duration || duration }, timestamp: Date.now()
            };
            const k2 = chatKey(state.currentChat.type, state.currentChat.id);
            if (!state.chatMessages[k2]) state.chatMessages[k2] = [];
            state.chatMessages[k2].push(msg);
            appendMsgEl(msg); scrollChatBottom(); saveMsgCache();
          } catch (e) { toast(e.message, 'error'); }
          state.audioChunks = [];
        };
        mr.start();
      } catch (e) {
        isPressing = false; sendBtn.classList.remove('recording'); hint.classList.remove('show');
        toast('无法录音：' + e.message, 'error');
      }
    }
    function stopRecording() {
      try { if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') state.mediaRecorder.stop(); }
      catch (e) { /* ignore */ }
    }
  }

  function appendMsgEl(msg, container) {
    container = container || $('#chat-msgs'); if (!container) return;
    // 避免重复
    if (container.querySelector('[data-msg-id="' + msg.id + '"]')) return;
    const isMe = msg.fromId === state.me.id;
    const row = $el('div', { class: 'msg-row' + (isMe ? ' me' : ''), 'data-msg-id': msg.id });
    if (!isMe) {
      // 查找发送者头像
      let sender = null;
      if (state.currentChat.type === 'group') {
        if (state.friends.find(f => f.userId === msg.fromId)) sender = state.friends.find(f => f.userId === msg.fromId).user;
        if (!sender && msg.fromId === state.me.id) sender = state.me;
      } else {
        sender = state.currentChat.user;
      }
      const av = renderAvatarEl(sender, 'sm');
      av.onclick = () => openUserProfile(msg.fromId);
      row.appendChild(av);
    }
    const bub = $el('div', { class: 'msg-bubble' });
    if (state.currentChat.type === 'group' && !isMe) {
      bub.appendChild($el('div', { class: 'sender-name' }, msg.fromNickname || ''));
    }
    if (msg.contentType === 'text') {
      const parts = (msg.content || '').split(/(\n)/);
      const span = $el('div', { style: { whiteSpace: 'pre-wrap', wordBreak: 'break-word' } });
      span.textContent = msg.content || '';
      bub.appendChild(span);
    } else if (msg.contentType === 'image') {
      const url = apiBase() + (msg.image && (msg.image.url || msg.image));
      const src = (msg.image && msg.image.url) ? (apiBase() + msg.image.url) : (msg.image ? (apiBase() + msg.image) : '');
      const img = $el('img', { src: src || url });
      img.onclick = () => openImagePreview(src || url);
      bub.appendChild(img);
    } else if (msg.contentType === 'audio') {
      const url = apiBase() + (msg.audio && msg.audio.url ? msg.audio.url : (msg.audio || ''));
      const duration = (msg.audio && msg.audio.duration) ? msg.audio.duration : 0;
      const audWrap = $el('div', { class: 'audio-msg' });
      const play = $el('button', { class: 'play-btn' }, '▶');
      const dur = $el('div', { class: 'duration' }, duration ? duration + '″' : '″');
      const prog = $el('div', { class: 'progress' }, $el('div', { class: 'progress-bar' }));
      let audio = null, playing = false;
      play.onclick = async () => {
        if (playing) { if (audio) { audio.pause(); audio.currentTime = 0; } playing = false; play.textContent = '▶'; return; }
        if (!audio) {
          audio = new Audio(url);
          audio.addEventListener('timeupdate', () => {
            const p = prog.querySelector('.progress-bar');
            if (p && audio.duration) p.style.width = (audio.currentTime / audio.duration * 100) + '%';
          });
          audio.addEventListener('ended', () => { playing = false; play.textContent = '▶'; const p = prog.querySelector('.progress-bar'); if (p) p.style.width = '0%'; });
        }
        try {
          await audio.play(); playing = true; play.textContent = '⏸';
        } catch (e) { toast('无法播放语音', 'error'); playing = false; }
      };
      audWrap.append(play, dur, prog);
      bub.appendChild(audWrap);
    }
    bub.appendChild($el('div', { class: 'time' }, formatTime(msg.timestamp)));
    row.appendChild(bub);
    if (isMe) {
      const av = renderAvatarEl(state.me, 'sm'); row.appendChild(av);
    }
    container.appendChild(row);
  }
  function scrollChatBottom() {
    const el = $('#chat-msgs'); if (el) setTimeout(() => el.scrollTop = el.scrollHeight, 10);
  }
  // ================= 图片预览 =================
  function openImagePreview(url) {
    const pv = $el('div', { class: 'image-preview' });
    pv.appendChild($el('img', { src: url }));
    const cl = $el('button', { class: 'close-btn' }, '✕');
    cl.onclick = () => pv.remove();
    pv.onclick = (e) => { if (e.target === pv) pv.remove(); };
    pv.appendChild(cl); document.body.appendChild(pv);
  }
  // ================= 群信息 / 群管理页 =================
  async function openGroupInfo(gid) {
    const m = makeModal('群信息', 'lg');
    m.body.appendChild($el('div', { class: 'text-center' }, $el('span', { class: 'loading primary', style: { width: 30, height: 30 } })));
    try {
      // 拿到群信息
      const groups = state.groups.find(x => x.group.id === gid);
      if (!groups) throw new Error('你未加入该群');
      const membersRes = await http('/groups/' + gid + '/members');
      const members = membersRes.members || [];
      const g = groups.group;
      const myRole = groups.role;
      m.body.innerHTML = '';

      // 头部
      const header = $el('div', { class: 'profile-header' });
      const av = $el('div', { class: 'avatar lg', style: { background: 'var(--md-secondary-container)', color: 'var(--md-on-primary-container)', fontSize: 40 } }, '👥');
      header.appendChild(av);
      header.appendChild($el('h2', {}, g.name));
      header.appendChild($el('div', { class: 'id' }, '群号：' + g.groupNumber + (g.hasPassword ? ' · 🔒已加密' : '')));
      m.body.appendChild(header);
      const bodyEl = $el('div', { class: 'profile-body' });
      if (g.description) bodyEl.appendChild($el('div', { class: 'profile-info-row' }, [$el('span', { class: 'label' }, '群描述'), $el('span', { class: 'value', style: { textAlign: 'right', maxWidth: '60%' } }, g.description)]));
      bodyEl.appendChild($el('div', { class: 'profile-info-row' }, [$el('span', { class: 'label' }, '成员数'), $el('span', { class: 'value' }, String(members.length))]));
      bodyEl.appendChild($el('div', { class: 'profile-info-row' }, [$el('span', { class: 'label' }, '我的身份'), $el('span', { class: 'value', style: { color: myRole === 'owner' ? 'var(--md-primary)' : myRole === 'admin' ? '#E65100' : 'inherit' } }, myRole === 'owner' ? '群主' : myRole === 'admin' ? '管理员' : '成员')]));
      m.body.appendChild(bodyEl);

      // 成员列表（可滚动）
      m.body.appendChild($el('div', { style: { padding: '8px 20px 0', fontSize: 14, color: 'var(--md-on-surface-variant)', fontWeight: 500 } }, '群成员'));
      const listEl = $el('div', { style: { maxHeight: 240, overflowY: 'auto', padding: '4px 12px 12px', borderRadius: 'var(--md-radius-md)', margin: '4px 8px 0', background: 'var(--md-surface-container-low)' } });
      // 排序：群主 > 管理员 > 成员
      const order = { owner: 0, admin: 1, member: 2 };
      members.sort((a, b) => order[a.role] - order[b.role]);
      members.forEach(mm => {
        const row = $el('div', { class: 'member-item' });
        const av = renderAvatarEl(mm.user, 'sm'); av.style.cursor = 'pointer'; av.onclick = () => openUserProfile(mm.userId);
        row.appendChild(av);
        const nm = $el('div', { style: { flex: 1, minWidth: 0 } });
        const nr = $el('div', { style: { fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, mm.user?.nickname || mm.user?.username);
        if (mm.role === 'owner') nr.appendChild($el('span', { class: 'role-tag role-owner' }, '群主'));
        else if (mm.role === 'admin') nr.appendChild($el('span', { class: 'role-tag role-admin' }, '管理'));
        if (mm.mutedUntil && mm.mutedUntil > Date.now()) nr.appendChild($el('span', { class: 'role-tag role-member', style: { background: 'var(--md-error-container)', color: 'var(--md-error)', marginLeft: 4 } }, '禁言中'));
        nm.appendChild(nr);
        nm.appendChild($el('div', { style: { fontSize: 11, color: 'var(--md-on-surface-variant)' } }, '加入于 ' + formatDate(mm.joinedAt)));
        row.appendChild(nm);
        // 管理操作（群主/管理员）
        if (mm.userId !== state.me.id) {
          const canManage = (myRole === 'owner') || (myRole === 'admin' && mm.role === 'member');
          const canSetAdmin = (myRole === 'owner' && mm.role !== 'owner');
          const actions = $el('div', { style: { display: 'flex', gap: 4, flexWrap: 'wrap', justifyContent: 'flex-end', marginLeft: 8 } });
          if (canSetAdmin) {
            const setText = mm.role === 'admin' ? '取消管理' : '设为管理';
            const sBtn = $el('button', { class: 'btn btn-text', style: { padding: '2px 6px', height: 26, fontSize: 12, minWidth: 0 } }, setText);
            sBtn.onclick = () => {
              if (confirm(`${setText}：${mm.user?.nickname || ''}？`)) wsSend({ type: 'group:set_admin', groupId: gid, userId: mm.userId, isAdmin: mm.role !== 'admin' });
            };
            actions.appendChild(sBtn);
          }
          if (canManage) {
            const kBtn = $el('button', { class: 'btn btn-text', style: { padding: '2px 6px', height: 26, fontSize: 12, color: 'var(--md-error)', minWidth: 0 } }, '移出');
            kBtn.onclick = () => { if (confirm(`确定移出：${mm.user?.nickname || ''}？`)) wsSend({ type: 'group:kick', groupId: gid, userId: mm.userId }); };
            actions.appendChild(kBtn);
            if (!mm.mutedUntil || mm.mutedUntil <= Date.now()) {
              const mBtn = $el('button', { class: 'btn btn-text', style: { padding: '2px 6px', height: 26, fontSize: 12, minWidth: 0 } }, '禁言');
              mBtn.onclick = () => {
                const input = prompt('请输入禁言分钟数（0 表示解除禁言）', '10');
                if (input === null) return;
                const mins = parseInt(input, 10);
                if (isNaN(mins) || mins < 0) return toast('输入无效', 'error');
                const until = mins === 0 ? 0 : (Date.now() + mins * 60 * 1000);
                wsSend({ type: mins === 0 ? 'group:unmute' : 'group:mute', groupId: gid, userId: mm.userId, mutedUntil: until });
              };
              actions.appendChild(mBtn);
            } else {
              const uBtn = $el('button', { class: 'btn btn-text', style: { padding: '2px 6px', height: 26, fontSize: 12, minWidth: 0, color: '#2E7D32' } }, '解除');
              uBtn.onclick = () => { if (confirm('解除禁言？')) wsSend({ type: 'group:unmute', groupId: gid, userId: mm.userId }); };
              actions.appendChild(uBtn);
            }
          }
          if (actions.children.length) row.appendChild(actions);
        }
        listEl.appendChild(row);
      });
      m.body.appendChild(listEl);

      // 底部操作
      const actions = $el('div', { class: 'profile-actions' });
      const chatBtn = $el('button', { class: 'btn btn-filled', style: { flex: 1 } }, '💬 进入群聊');
      chatBtn.onclick = () => { m.close(); openGroupChat(g); };
      actions.appendChild(chatBtn);
      if (myRole === 'owner') {
        const disB = $el('button', { class: 'btn btn-outline', style: { color: 'var(--md-error)', borderColor: 'var(--md-error-container)' } }, '解散群');
        disB.onclick = () => { if (confirm('⚠️ 确定解散该群？所有成员将被移出且消息将被删除！')) wsSend({ type: 'group:dismiss', groupId: gid }); m.close(); closeChat(); };
        actions.appendChild(disB);
      } else {
        const lvB = $el('button', { class: 'btn btn-outline', style: { color: 'var(--md-error)', borderColor: 'var(--md-error-container)' } }, '退出群');
        lvB.onclick = () => { if (confirm('确定退出该群？')) { wsSend({ type: 'group:leave', groupId: gid }); m.close(); closeChat(); } };
        actions.appendChild(lvB);
      }
      m.body.appendChild(actions);
    } catch (e) { m.body.innerHTML = `<p style="color:var(--md-error);text-align:center;padding:20px">${e.message}</p>`; }
  }
  // 初始化
  render();
})();


</script>
